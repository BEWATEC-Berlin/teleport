name: Build and publish Teleport OSS image (from source)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Teleport version without leading v (example: 18.2.4)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: BEWATEC-Berlin/teleport

jobs:
  build-debs:
    name: Build OSS deb packages
    runs-on: ${{ matrix.runs_on }}
    env:
      GOCACHE: ${{ runner.temp }}/go-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-22.04
          - arch: arm64
            runs_on: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build buildbox image needed for packaging
        run: |
          cd build.assets
          make buildbox-centos7

      - name: Build OSS release artifacts
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "${GOCACHE}"
          cd build.assets
          make release-centos7 ARCH=${ARCH} VERSION=${VERSION}

      - name: Collect deb artifact
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/debs
          DEB_PATH=$(find build -type f -name "teleport_${VERSION}_${ARCH}.deb" | head -n 1)
          test -n "${DEB_PATH}"
          cp "${DEB_PATH}" "/tmp/debs/teleport_${VERSION}_${ARCH}.deb"
          ls -lah /tmp/debs

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: /tmp/debs/teleport_${{ inputs.version }}_${{ matrix.arch }}.deb
          if-no-files-found: error

  publish-image:
    name: Build and push multi-arch distroless image
    runs-on: ubuntu-22.04
    needs: build-debs

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v${{ inputs.version }}

      - name: Download amd64 deb
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: .

      - name: Download arm64 deb
        uses: actions/download-artifact@v4
        with:
          name: deb-arm64
          path: .

      - name: Verify deb files
        run: |
          ls -lah .
          test -f "teleport_${{ inputs.version }}_amd64.deb"
          test -f "teleport_${{ inputs.version }}_arm64.deb"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=v${{ inputs.version }}

      - name: Build and push distroless multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build.assets/charts/Dockerfile-distroless
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TELEPORT_VERSION=${{ inputs.version }}
            TELEPORT_RELEASE_INFIX=
